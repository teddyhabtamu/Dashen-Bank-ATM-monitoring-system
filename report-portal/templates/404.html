<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Dashen Bank ATM Monitoring</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:linear-gradient(135deg,#F0F2F6 0%,#E2E8F0 100%);
  color:#0F172A;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.error-card{
  background:#fff;border-radius:20px;width:520px;max-width:100%;
  box-shadow:0 24px 80px rgba(1,33,105,.12);
  padding:48px 44px 40px;
  animation:cardIn .4s ease;text-align:center;
  position:relative;overflow:hidden;
}
.error-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#012169 0%,#FDD79A 50%,#012169 100%);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.logo-wrap{text-align:center;margin-bottom:24px}
.logo-wrap img{width:48px;height:48px;object-fit:contain}
.error-code-wrap{position:relative;margin-bottom:8px}
.error-code{font-size:96px;font-weight:800;color:#012169;line-height:1;letter-spacing:-6px;position:relative;z-index:1}
.error-code-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:220px;font-weight:900;color:#F1F4F9;line-height:1;letter-spacing:-12px;user-select:none;pointer-events:none;z-index:0}
.error-accent{width:40px;height:3px;background:#FDD79A;border-radius:2px;margin:12px auto 20px}
h1{font-size:17px;font-weight:700;color:#0F172A;margin-bottom:8px}
p{font-size:13px;color:#64748B;margin-bottom:28px;line-height:1.7;max-width:380px;margin-left:auto;margin-right:auto}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 22px;border-radius:10px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:.2s;text-decoration:none
}
.btn-primary{background:#012169;color:#fff}
.btn-primary:hover{background:#273274;box-shadow:0 4px 16px rgba(1,33,105,.25);transform:translateY(-1px)}
.btn-outline{background:transparent;color:#475569;border:1px solid #E4E9F1}
.btn-outline:hover{background:#F8FAFC;border-color:#CBD5E1;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#64748B;border:none;padding:10px 16px}
.btn-ghost:hover{background:#F1F5F9;color:#475569;border-radius:10px}
.footer{text-align:center;margin-top:28px;font-size:11px;color:#94A3B8;border-top:1px solid #EEF1F6;padding-top:20px}
.links{display:flex;justify-content:center;gap:20px;margin-top:8px;flex-wrap:wrap}
.links a{font-size:11px;color:#64748B;text-decoration:none;display:flex;align-items:center;gap:5px;transition:.15s}
.links a:hover{color:#012169}
@media(max-width:480px){
  .error-card{padding:36px 20px 28px;border-radius:14px}
  .error-code{font-size:64px;letter-spacing:-4px}
  .error-code-bg{font-size:150px}
  .error-card h1{font-size:15px}
  .actions{gap:8px}
  .actions .btn{flex:1;justify-content:center;padding:10px 14px;font-size:12px}
  .links{gap:14px}
}
</style>
</head>
<body>
<div class="error-card">
  <div class="logo-wrap">
    <img src="https://cdn.brandfetch.io/idNZ7JoLsG/w/150/h/149/theme/dark/logo.png?c=1dxbfHSJFAPEGdCLU4o5B" alt="Dashen Bank">
  </div>
  <div class="error-code-wrap">
    <div class="error-code-bg">404</div>
    <div class="error-code">404</div>
  </div>
  <div class="error-accent"></div>
  <h1>This page is off the grid</h1>
  <p>The page you're looking for doesn't exist or has been moved.<br>Let's get you back to somewhere familiar.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary"><i data-lucide="layout-dashboard" style="width:15px;height:15px"></i> Dashboard</a>
    <a href="/ej-search" class="btn btn-outline"><i data-lucide="file-search" style="width:15px;height:15px"></i> EJ Search</a>
    <a href="/admin/atm" class="btn btn-outline"><i data-lucide="settings" style="width:15px;height:15px"></i> ATMs</a>
  </div>
  <div class="footer">
    Dashen Bank S.C. &mdash; ATM Monitoring System
    <div class="links">
      <a href="/"><i data-lucide="home" style="width:12px;height:12px"></i> Home</a>
      <a href="javascript:history.back()"><i data-lucide="arrow-left" style="width:12px;height:12px"></i> Go Back</a>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
