<div class="fleet-pager">
  <span class="page">Page {{ page }} of {{ total_pages }}</span>
  {% if page > 1 %}
  <a class="btn btn-outline" href="{{ url_for('onboarding.onboard_fleet', filter=filter_mode, q=q, per_page=per_page, page=page - 1) }}">&larr; Prev</a>
  {% else %}
  <span class="btn btn-outline disabled" aria-disabled="true">&larr; Prev</span>
  {% endif %}
  {% if page < total_pages %}
  <a class="btn btn-outline" href="{{ url_for('onboarding.onboard_fleet', filter=filter_mode, q=q, per_page=per_page, page=page + 1) }}">Next &rarr;</a>
  {% else %}
  <span class="btn btn-outline disabled" aria-disabled="true">Next &rarr;</span>
  {% endif %}
</div>
