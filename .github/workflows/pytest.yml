name: pytest (portal suite)

on:
  push:
    branches: [uat-prep, main]
  pull_request:
    branches: [uat-prep, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the runtime dependencies the tests import
        run: "python -m pip install --only-binary :all: -r tests/requirements.txt"
      - name: Install test runner
        run: "python -m pip install --only-binary :all: pytest==9.1.1"
      - name: Run suite (lab-dependent cases skip, never fail)
        run: python -m pytest tests/ -v --junitxml=pytest-results.xml
      - name: Publish failing tests as annotations
        if: failure()
        run: python tests/ci_annotate_junit.py pytest-results.xml
