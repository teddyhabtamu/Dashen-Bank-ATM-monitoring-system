  txn-feed-001:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: txn-feed-001
    command: python3 transaction_feed.py
    environment:
      ATM_ID: "ATM-001"
      ATM_TERMINAL_ID: "TID001"
      ATM_BRANCH: "Addis Ababa Main Branch"
