      ATM_TERMINAL_ID: "TID004"
      ATM_BRANCH: "Hawassa Branch"
      SNMP_PORT: "1164"
    ports:
      - "1164:1164"
    restart: unless-stopped

  atm-sim-005:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: atm-sim-005
    command: python3 atm_snmp_simulator.py
    environment:
