services:
  postgres:
    image: postgres:15
    container_name: zabbix-db
    environment:
      POSTGRES_DB: "zabbix"
      POSTGRES_USER: "zabbix"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-uat/postgresql-custom.conf:/etc/postgresql/postgresql.conf.d/custom.conf:ro
    ports:
      - "5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-6.4-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: "postgres"
      POSTGRES_DB: "zabbix"
      POSTGRES_USER: "zabbix"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Zabbix 6.4 ships a 32M configuration cache. A ~1,200-host fleet with
      # the ATM templates needs far more; the configuration syncer dies with
      # "out of memory (requested 40 bytes) ... please increase CacheSize"
      # and the container restart-loops. Shared memory must cover every cache,
      # so shm_size is raised with them (Docker's default /dev/shm is 64M).
      ZBX_CACHESIZE: "${ZBX_CACHESIZE:-512M}"
      ZBX_VALUECACHESIZE: "${ZBX_VALUECACHESIZE:-256M}"
      ZBX_HISTORYCACHESIZE: "${ZBX_HISTORYCACHESIZE:-64M}"
      ZBX_TRENDCACHESIZE: "${ZBX_TRENDCACHESIZE:-32M}"
      # Five pollers (the 6.4 default) cannot keep up with 1,200 hosts: the
      # NCR template alone has 31 SNMP checks per host every 10-30s, so the
      # agent items can sit behind the queue for hours. 50 is a safe start on
      # the 31G UAT host; tune with ZBX_STARTPOLLERS in .env.
      ZBX_STARTPOLLERS: "${ZBX_STARTPOLLERS:-50}"
      ZBX_STARTPOLLERSUNREACHABLE: "${ZBX_STARTPOLLERSUNREACHABLE:-10}"
      # Match the SNMP timeout tuned on UAT-01; kept in the repo so a pull
      # no longer conflicts with the server's local compose edit.
      ZBX_TIMEOUT: "${ZBX_TIMEOUT:-15}"
    shm_size: "${ZBX_SHM_SIZE:-1g}"
    ports:
      - "10051:10051"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-6.4-latest
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: "postgres"
      POSTGRES_DB: "zabbix"
      POSTGRES_USER: "zabbix"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      ZBX_SERVER_HOST: "zabbix-server"
      PHP_TZ: "Africa/Addis_Ababa"
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-6.4-latest
    container_name: zabbix-agent
    network_mode: "host"
    privileged: true
    environment:
      ZBX_HOSTNAME: "Zabbix-Server-UAT01"
      # Passive checks arrive from the Zabbix server container via the compose
      # bridge network — allow it alongside localhost (else "connection rejected").
      ZBX_SERVER_HOST: "127.0.0.1,172.18.0.0/16"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      - zabbix-server

  mariadb:
    image: mariadb:10.11
    container_name: glpi-db
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "glpi"
      MYSQL_USER: "glpi"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  glpi:
    image: diouxx/glpi:latest
    container_name: glpi
    environment:
      TZ: "Africa/Addis_Ababa"
      MARIADB_HOST: "mariadb"
      MARIADB_DATABASE: "glpi"
      MARIADB_USER: "glpi"
      MARIADB_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "8082:80"
    volumes:
      - glpi-root:/var/www/html/glpi
      # Dashen Bank theme plugin (repo-tracked). The public/ mount is what the
      # web server actually serves (/plugins/dashentheme/...) — see README.
      - ./glpi-plugins/dashentheme:/var/www/html/glpi/marketplace/dashentheme:ro
      - ./glpi-plugins/dashentheme:/var/www/html/glpi/public/plugins/dashentheme:ro
    depends_on:
      - mariadb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.6
    container_name: grafana
    user: "root"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      # LDAP directory auth (bank AD down the road, mock LDAP in lab).
      # Disabled by default; local accounts always keep working.
      GF_AUTH_LDAP_ENABLED: "${GF_AUTH_LDAP_ENABLED:-false}"
      GF_AUTH_LDAP_CONFIG_FILE: "/etc/grafana/ldap.toml"
      # Consumed by ldap.toml ($__env) for the directory bind. Empty by
      # default; set on hosts where LDAP is enabled.
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-}"
      # Postgres datasource password (== DB_PASS); expanded inside datasources-uat.yml
      GF_PG_PASSWORD: "${DB_PASS}"
      # Zabbix datasource credentials; expanded inside datasources-uat.yml.
      # Dedicated svc-grafana account post-cutover (docs/zabbix-api-users.md);
      # GF_ZBX_USER defaults to Admin (pre-cutover behavior), GF_ZBX_PASSWORD
      # falls back to ZBX_PASS only if its own slot is unset. Prefer explicit
      # per-account values — never ${}-reference another slot (compose expands
      # them, bash-sourced scripts do NOT).
      GF_ZBX_USER: "${GF_ZBX_USER:-Admin}"
      GF_ZBX_PASSWORD: "${GF_ZBX_PASSWORD:-${ZBX_PASS}}"
      GF_INSTALL_PLUGINS: "alexanderzobnin-zabbix-app 4.4.5"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "alexanderzobnin-zabbix-datasource,alexanderzobnin-zabbix-app"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./index.html:/usr/share/grafana/public/views/index.html:ro
      - ./logo.png:/usr/share/grafana/public/img/dashen-logo.png:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./config/grafana/datasources-uat.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    environment:
      ENABLE_METRICS: "true"
    ports:
      - "8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  report-portal:
    build:
      context: ./report-portal
      dockerfile: Dockerfile
    container_name: report-portal
    environment:
      DB_HOST: "postgres"
      # Portal database. Defaults to "zabbix", the pre-split layout where
      # portal tables shared a database with Zabbix's own configuration. Set
      # PORTAL_DB_NAME=portal in .env to use the split database. Never point
      # Zabbix itself here.
      DB_NAME: "${PORTAL_DB_NAME:-zabbix}"
      DB_USER: "zabbix"
      DB_PASS: "${DB_PASS}"
      GRAFANA_URL: "${GRAFANA_URL}"
      ZABBIX_UI_URL: "${ZABBIX_UI_URL}"
      GLPI_UI_URL: "${GLPI_UI_URL}"
      REPORT_PORTAL_PORT: "8888"
      EVIDENCE_RAW_DIR: "/app/evidence/raw"
      # Host-side, read-only image bridge. The socket directory is mounted
      # read-only below; the portal has no route to ATM TCP/10050. The token
      # must match /etc/atm-monitoring/image-bridge.env on the host.
      ATM_IMAGE_BRIDGE_SOCKET: "/run/atm-image-bridge/bridge.sock"
      ATM_IMAGE_BRIDGE_TOKEN: "${ATM_IMAGE_BRIDGE_TOKEN:-}"
      BASE_URL: "${BASE_URL:-http://localhost:8888}"
      ES_HOST: "${DATA_VM_IP}:9200"
      ES_INDEX: "atm-ej-live-*,atm-electronic-journal"
      ADMIN_USER: "${ADMIN_USER}"
      ADMIN_PASS: "${ADMIN_PASS}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-atm-monitor@dashenbank.com}"
      SMTP_INSECURE: "${SMTP_INSECURE:-false}"
      SMTP_CA_FILE: "${SMTP_CA_FILE:-}"
      ENABLE_SIMULATORS: "${ENABLE_SIMULATORS:-false}"
      AUTH_MODE: "${AUTH_MODE:-local}"
      LDAP_HOST: "${LDAP_HOST:-}"
      LDAP_PORT: "${LDAP_PORT:-389}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-}"
      LDAP_BIND_DN: "${LDAP_BIND_DN:-}"
      LDAP_BIND_PASSWORD: "${LDAP_BIND_PASSWORD:-}"
      LDAP_LOGIN_ATTR: "${LDAP_LOGIN_ATTR:-uid}"
      LDAP_ADMINS_GROUP: "${LDAP_ADMINS_GROUP:-ATM-Admins}"
      LDAP_OPERATORS_GROUP: "${LDAP_OPERATORS_GROUP:-ATM-Operators}"
      # Shared scheduler→app auth key: every gunicorn worker must see the
      # SAME value or internal report fetches bounce to the login page
      # (and get emailed as fake PDFs). Set once in .env.
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
      ZABBIX_URL: "http://zabbix-web:8080/api_jsonrpc.php"
      ZABBIX_USER: "${ZABBIX_USER:-Admin}"
      ZABBIX_PASS: "${ZABBIX_PASS}"
      GLPI_APP_TOKEN: "${GLPI_APP_TOKEN:-}"
      GLPI_USER: "${GLPI_USER:-glpi}"
      GLPI_API_PASSWORD: "${GLPI_API_PASSWORD:-}"
      ATM_PROFILE_SECRET: "${ATM_PROFILE_SECRET:-}"
      ATM_AGENT_SERVER: "${ATM_AGENT_SERVER:-}"
    volumes:
      - ./report-portal:/app:rw
      - ./ej-logs/raw:/app/evidence/raw:ro
      # Unix socket created by the host atm-image-bridge service. Mount the
      # directory, not one socket inode: a service restart must keep working.
      - /run/atm-image-bridge:/run/atm-image-bridge:ro
      - ./zabbix_modules:/app/zabbix_modules:ro
      - ./config/status_map.json:/app/config/status_map.json:ro
      - ./config/cassette_capacity.json:/app/config/cassette_capacity.json:ro
    # The portal runs as the unprivileged appuser (uid 10001).  The bridge
    # socket is owned by the deploy user and mode 0660, so the container needs
    # that group as a supplementary group to connect.  Set this to `id -g`
    # for the account running atm-image-bridge; 1000 is the usual UAT value.
    group_add:
      - "${ATM_IMAGE_BRIDGE_GID:-1000}"
    ports:
      - "8888:8888"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  cash-watcher:
    build:
      context: .
      dockerfile: simulators/Dockerfile.atm-simulator
    container_name: cash-watcher
    command: python3 /app/cash_watcher.py
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: "postgres"
      # Portal database. Defaults to "zabbix", the pre-split layout where
      # portal tables shared a database with Zabbix's own configuration. Set
      # PORTAL_DB_NAME=portal in .env to use the split database. Never point
      # Zabbix itself here.
      DB_NAME: "${PORTAL_DB_NAME:-zabbix}"
      DB_USER: "zabbix"
      DB_PASS: "${DB_PASS}"
      ZBX_URL: "http://zabbix-web:8080/api_jsonrpc.php"
      ZBX_USER: "${ZBX_USER:-Admin}"
      ZBX_PASS: "${ZBX_PASS}"
      CASH_WATCH_INTERVAL: "300"
      MIN_AUTO_LOAD: "200"
    volumes:
      - ./cash_watcher.py:/app/cash_watcher.py:ro
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  anomaly-detector:
    build:
      context: .
      dockerfile: simulators/Dockerfile.atm-simulator
    container_name: anomaly-detector
    command: python3 /app/anomaly_detector.py
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: "postgres"
      # Portal database. Defaults to "zabbix", the pre-split layout where
      # portal tables shared a database with Zabbix's own configuration. Set
      # PORTAL_DB_NAME=portal in .env to use the split database. Never point
      # Zabbix itself here.
      DB_NAME: "${PORTAL_DB_NAME:-zabbix}"
      DB_USER: "zabbix"
      DB_PASS: "${DB_PASS}"
      CHECK_INTERVAL: "60"
      VELOCITY_WINDOW: "10"
      VELOCITY_LIMIT: "3"
      LARGE_TXN_ETB: "8000"
      RAPID_WINDOW: "5"
      RAPID_LIMIT: "5"
      FAILURE_WINDOW: "15"
      FAILURE_THRESHOLD: "0.4"
      ENABLE_SIMULATORS: "${ENABLE_SIMULATORS:-false}"
    volumes:
      - ./anomaly_detector.py:/app/anomaly_detector.py:ro
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  network-correlator:
    build:
      context: .
      dockerfile: simulators/Dockerfile.atm-simulator
    container_name: network-correlator
    command: python3 /app/network_correlator.py
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: "postgres"
      # Portal database. Defaults to "zabbix", the pre-split layout where
      # portal tables shared a database with Zabbix's own configuration. Set
      # PORTAL_DB_NAME=portal in .env to use the split database. Never point
      # Zabbix itself here.
      DB_NAME: "${PORTAL_DB_NAME:-zabbix}"
      DB_USER: "zabbix"
      DB_PASS: "${DB_PASS}"
      ZABBIX_URL: "http://zabbix-web:8080/api_jsonrpc.php"
      # Service identity comes from ZBX_USER (svc-scripts) — this service
      # reads the legacy ZABBIX_* names, so they are mapped, not hardcoded.
      ZABBIX_USER: "${ZBX_USER:-Admin}"
      ZABBIX_PASS: "${ZBX_PASS}"
      CHECK_INTERVAL: "120"
      LATENCY_THRESHOLD: "200"
      LOSS_THRESHOLD: "10"
    volumes:
      - ./network_correlator.py:/app/network_correlator.py:ro
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  state-manager:
    build:
      context: .
      dockerfile: simulators/Dockerfile.atm-simulator
    container_name: state-manager
    command: python3 /app/state_manager.py
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: "postgres"
      # Portal database. Defaults to "zabbix", the pre-split layout where
      # portal tables shared a database with Zabbix's own configuration. Set
      # PORTAL_DB_NAME=portal in .env to use the split database. Never point
      # Zabbix itself here.
      DB_NAME: "${PORTAL_DB_NAME:-zabbix}"
      DB_USER: "zabbix"
      DB_PASS: "${DB_PASS}"
      ZBX_URL: "http://zabbix-web:8080/api_jsonrpc.php"
      ZBX_USER: "${ZBX_USER:-Admin}"
      ZBX_PASS: "${ZBX_PASS}"
      STATE_POLL_INTERVAL: "30"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat-oss:7.12.1
    container_name: filebeat
    user: root
    environment:
      ES_HOST: "${DATA_VM_IP:-172.22.10.60}:9200"
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      # NB: filebeat refuses to start unless filebeat.yml is owned by
      # root:root (mode 644). git pull resets ownership -> after any pull
      # touching filebeat.yml run:
      #   sudo chown root:root filebeat.yml && sudo chmod 644 filebeat.yml
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./ej-logs:/var/log/atm-ej:ro
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── Mock LDAP lab (NOT part of UAT) ──────────────────────────────────────
  # Stand-in for bank Active Directory while IAM access is pending. Starts
  # ONLY with `--profile ldap`, so normal `up` is unaffected. See
  # config/ldap/README.md for the switchover checklist.
  mock-ldap:
    image: osixia/openldap:1.5.0
    container_name: mock-ldap
    profiles:
      - ldap
    command: --copy-service --loglevel info
    environment:
      LDAP_ORGANISATION: "ATM Monitoring Lab"
      LDAP_DOMAIN: "atmmon.local"
      LDAP_BASE_DN: "dc=atmmon,dc=local"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-LabAdminPass123!}"
      LDAP_CONFIG_PASSWORD: "${LDAP_ADMIN_PASSWORD:-LabAdminPass123!}"
      LDAP_READONLY_USER: "false"
      LDAP_TLS: "false"
    volumes:
      - ./config/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    ports:
      - "3890:389"
    restart: "no"

volumes:
  pgdata:
  mariadb-data:
  glpi-root:
  grafana-data:
  ldap-data:
  ldap-config: