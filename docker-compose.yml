services:

  postgres:
    image: postgres:15
    container_name: zabbix-db
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-6.4-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "10051:10051"
    depends_on:
      - postgres
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-6.4-latest
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Africa/Addis_Ababa
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - zabbix-server
    restart: unless-stopped

  # --- ADDED SERVICE START ---
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-6.4-latest
    container_name: zabbix-agent
    network_mode: "host" # Allows direct scanning of active host interfaces like eth0
    privileged: true     # Ensures the agent has permissions to read local hardware state
    environment:
      ZBX_HOSTNAME: "ATM-001-Addis-Branch" # Must exactly match the Host name field in Zabbix
      ZBX_SERVER_HOST: "127.0.0.1"        # Since it runs on host network mode alongside forwarded ports
    restart: unless-stopped
    depends_on:
      - zabbix-server
  # --- ADDED SERVICE END ---

  grafana:
    image: grafana/grafana:10.2.6
    container_name: grafana
    user: "root"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app 4.4.5
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: alexanderzobnin-zabbix-datasource,alexanderzobnin-zabbix-app
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/ATM Operations Centre — Dashen Bank-1781385603999.json
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./index.html:/usr/share/grafana/public/views/index.html:ro
      - ./logo.png:/usr/share/grafana/public/img/dashen-logo.png:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - zabbix-web
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - compatibility.override_main_response_version=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat-oss:7.12.1
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./ej-logs:/var/log/atm-ej:ro
    depends_on:
      - opensearch
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    container_name: glpi-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped

  glpi:
    image: diouxx/glpi:latest
    container_name: glpi
    environment:
      TZ: Africa/Addis_Ababa
      VERSION_GLPI: "10.0.15"
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8082:80"
    volumes:
      - glpi-root:/var/www/html/glpi
    depends_on:
      - mariadb
    restart: unless-stopped

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    environment:
      ENABLE_METRICS: "true"
    ports:
      - "8081:8081"
    restart: unless-stopped

  report-portal:
    build:
      context: ./report-portal
      dockerfile: Dockerfile
    container_name: report-portal
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      GRAFANA_URL: ${GRAFANA_URL}
      REPORT_PORTAL_PORT: ${REPORT_PORTAL_PORT}
      ES_HOST: opensearch:9200
      ES_INDEX: atm-ej-live-*,atm-electronic-journal
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-atm-monitor@dashenbank.com}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      FLASK_DEBUG: 1
    volumes:
      - ./report-portal:/app:rw
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
    restart: unless-stopped

  iso8583-gateway:
    build:
      context: ./camel
      dockerfile: Dockerfile.gateway
    container_name: iso8583-gateway
    environment:
      MODE: simulation
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      INTERVAL: "10"
      # Production settings (uncomment when real switch available):
      # MODE: tcp
      # SWITCH_HOST: 0.0.0.0
      # SWITCH_PORT: "9876"
    ports:
      - "9876:9876"
    depends_on:
      - postgres
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dashenbank.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dashen2024}
    ports:
      - "5050:80"
    restart: unless-stopped

  # ───  Anomaly Detector ────────────────────────────────
  anomaly-detector:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: anomaly-detector
    command: python3 /app/anomaly_detector.py
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      CHECK_INTERVAL: "60"
      VELOCITY_WINDOW: "10"
      VELOCITY_LIMIT: "3"
      LARGE_TXN_ETB: "8000"
      RAPID_WINDOW: "5"
      RAPID_LIMIT: "5"
      FAILURE_WINDOW: "15"
      FAILURE_THRESHOLD: "0.4"
    volumes:
      - ./anomaly_detector.py:/app/anomaly_detector.py:ro
      - /tmp:/tmp
    depends_on:
      - postgres
    restart: unless-stopped

  # ─── Network Correlator ──────────────────────────────
  network-correlator:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: network-correlator
    command: python3 /app/network_correlator.py
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      ZABBIX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_USER: Admin
      ZABBIX_PASS: zabbix
      CHECK_INTERVAL: "120"
      LATENCY_THRESHOLD: "200"
      LOSS_THRESHOLD: "10"
    volumes:
      - ./network_correlator.py:/app/network_correlator.py:ro
    depends_on:
      - postgres
    restart: unless-stopped
  

  # ─── ATM SIMULATORS ───────────────────────────────────────────
  # Each block = one real ATM in production
  # To connect real ATM: remove simulator, add real ATM IP to Zabbix

















  # ─── GRG ATM SIMULATORS ───────────────────────────────






  # ─── MULTI-TENANT SIMULATION ENGINES ───────────────────────
  # A single engine simulates EVERY ATM in atm_locations (auto-discovered).
  # ATMs registered in the Report Portal start being simulated automatically.
  atm-sim-engine:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: atm-sim-engine
    command: python3 sim_engine.py
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      GATEWAY_IP: "172.17.0.1"
    ports:
      - "1161-1250:1161-1250"
    restart: unless-stopped

  atm-txn-engine:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: atm-txn-engine
    command: python3 txn_engine.py
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
    depends_on:
      - postgres
    restart: unless-stopped

  atm-ej-engine:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: atm-ej-engine
    command: python3 ej_engine.py
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      EJ_LOG_DIR: /var/log/atm-ej
    volumes:
      - ./ej-logs:/var/log/atm-ej
    depends_on:
      - postgres
    restart: unless-stopped

  # ─── ATM STATE MANAGER (keeps atm_current_state fresh for Grafana) ──
  state-manager:
    build:
      context: ./simulators
      dockerfile: Dockerfile.atm-simulator
    container_name: state-manager
    command: python3 state_manager.py
    environment:
      DB_HOST: postgres
      DB_NAME: zabbix
      DB_USER: zabbix
      DB_PASS: ${DB_PASS}
      GATEWAY_IP: "172.17.0.1"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
  opensearch-data:
  mariadb-data:
  glpi-root:

