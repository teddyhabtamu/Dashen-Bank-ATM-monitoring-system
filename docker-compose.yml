    command: python3 transaction_feed.py
    environment:
      ATM_ID: "ATM-002"
      ATM_TERMINAL_ID: "TID002"
      ATM_BRANCH: "Bole International Branch"
      DB_HOST: "postgres"
      DB_NAME: "zabbix"
      DB_USER: "zabbix"
      DB_PASS: ${DB_PASS}
    depends_on:
