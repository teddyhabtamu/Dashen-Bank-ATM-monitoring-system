# Dashen Bank ATM — Zabbix agent additions (append to zabbix_agentd.conf
# on each NCR or GRG Windows core, then restart the Zabbix agent service).
#
# Prerequisites on the box:
#   * C:\monitor\atm-wmi-collector.ps1  (from scripts/atm-wmi-collector.ps1)
#   * PowerShell execution allows it (see runbook §9; whitelisting via
#     McAfee Solidifier change control if the agent log shows denials).
# Verify from the Zabbix server BEFORE templating:
#   zabbix_get -s <ATM_IP> -k "atm.parts"   (expect one JSON line)

# Full part-state tree (polled every 5 min; ~26 fields x ~35 parts).
# Master item for JSONPath dependents (one per part x field in template).
UserParameter=atm.parts,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-wmi-collector.ps1"

# Convenience: single part. NOTE the singular key — Zabbix treats
# atm.parts[*] as a duplicate of atm.parts and refuses to start
# ("key already exists"); atm.part[*] does not collide.
UserParameter=atm.part[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-wmi-collector.ps1" -Part "$1"

# -----------------------------------------------------------------------------
# GRG XFS Hardware Telemetry (Cash Dispenser & Cassettes)
# Prerequisites on GRG ATM:
#   * C:\monitor\grg-xfs-probe.ps1
# Polled every 1m or 5m. Emits single-line JSON with CDM status & cassette counts.
UserParameter=atm.xfs.cdm,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\grg-xfs-probe.ps1" -Json

# -----------------------------------------------------------------------------
# NCR APTRA XFS Hardware Telemetry (32-bit, PowerShell 2.0)
# Use this INSTEAD of the GRG atm.xfs.cdm line above on NCR cores:
#   * C:\monitor\ncr-xfs-probe.ps1
#   * Timeout=30 in zabbix_agentd.conf (the probe opens several XFS services)
# Uncomment the line below and comment out the GRG atm.xfs.cdm line.
# UserParameter=atm.xfs.cdm,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\ncr-xfs-probe.ps1"

# -----------------------------------------------------------------------------
# ATM image evidence — on-demand, read-only chunk reader
#
# Prerequisites on each ATM:
#   * C:\monitor\atm-image-chunk.ps1      (scripts/atm-image-chunk.ps1)
#   * C:\monitor\atm-image-roots.txt      (REQUIRED allow-list, fails closed)
#
# The agent's Timeout must be raised for these keys. Every call starts
# PowerShell, so the default 3 seconds is too short on a loaded ATM. Set
# Timeout=30 (or at least 10) in zabbix_agentd.conf / zabbix_agent2.conf and
# restart the agent. This affects the whole agent, not just these keys.
#
# These keys are a file-read primitive. Restrict TCP/10050 to the monitoring
# host/bridge and never point the portal container at them directly. The
# script refuses paths outside the allow-list, traversal, alternate data
# streams, reparse points, oversized files and chunks larger than 32 KiB.
# Zip entries are addressed by archive index, so an entry name (which may
# contain card data) never appears in a Zabbix key. Only image/video entries
# are listed and readable; other zip entries are filtered out. Directory
# listing is non-recursive and returns only image/video/zip names; use it
# instead of the recursive vfs.dir.get for evidence discovery.
#
# Test from the Zabbix server:
#   zabbix_get -s <ATM_IP> -t 30 -k 'atm.image.info["<base64url file path>"]'
#   zabbix_get -s <ATM_IP> -t 30 -k 'atm.image.chunk["<base64url file path>",0,24576]'
#   zabbix_get -s <ATM_IP> -t 30 -k 'atm.image.dir["<base64url dir path>",0,25]'
#   zabbix_get -s <ATM_IP> -t 30 -k 'atm.image.ziplist["<base64url zip path>",0,25]'
#   zabbix_get -s <ATM_IP> -t 30 -k 'atm.image.zipentry["<base64url zip path>",0,0,24576]'
UserParameter=atm.image.info[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-image-chunk.ps1" -PathB64 "$1" -Info
UserParameter=atm.image.chunk[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-image-chunk.ps1" -PathB64 "$1" -Offset "$2" -Length "$3"
UserParameter=atm.image.dir[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-image-chunk.ps1" -DirPathB64 "$1" -DirList -DirOffset "$2" -DirLimit "$3"
UserParameter=atm.image.ziplist[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-image-chunk.ps1" -ZipPathB64 "$1" -List -ListOffset "$2" -ListLimit "$3"
UserParameter=atm.image.zipentry[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-image-chunk.ps1" -ZipPathB64 "$1" -EntryIndex "$2" -Offset "$3" -Length "$4"

