# Dashen Bank ATM — Zabbix agent additions (append to zabbix_agentd.conf
# on each NCR Windows core, then restart the Zabbix agent service).
#
# Prerequisites on the box:
#   * C:\monitor\atm-wmi-collector.ps1  (from scripts/atm-wmi-collector.ps1)
#   * PowerShell execution allows it (see runbook §9; whitelisting via
#     McAfee Solidifier change control if the agent log shows denials).
# Verify from the Zabbix server BEFORE templating:
#   zabbix_get -s <ATM_IP> -k "atm.parts"   (expect one JSON line)

# Full part-state tree (polled every 5 min; ~26 fields x ~35 parts).
# Master item for JSONPath dependents (one per part x field in template).
UserParameter=atm.parts,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-wmi-collector.ps1"

# Convenience: single part. NOTE the singular key — Zabbix treats
# atm.parts[*] as a duplicate of atm.parts and refuses to start
# ("key already exists"); atm.part[*] does not collide.
UserParameter=atm.part[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\atm-wmi-collector.ps1" -Part "$1"

# -----------------------------------------------------------------------------
# GRG XFS Hardware Telemetry (Cash Dispenser & Cassettes)
# Prerequisites on GRG ATM:
#   * C:\monitor\grg-xfs-probe.ps1
# Polled every 1m or 5m. Emits single-line JSON with CDM status & cassette counts.
UserParameter=atm.xfs.cdm,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\monitor\grg-xfs-probe.ps1" -Json

