apiVersion: 1

# File-provisions the repo's ATM dashboards into a fixed folder.
# Mounted (read-only) by docker-compose.yml next to datasources-uat.yml.
providers:
  - name: ATM Monitoring
    orgId: 1
    folder: ATM Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/files
