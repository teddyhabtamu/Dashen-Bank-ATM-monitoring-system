apiVersion: 1

datasources:
  - name: Zabbix-ATM
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
    secureJsonData:
      password: ${ZABBIX_WEB_PASSWORD}

  - name: ATM-Transactions
    type: postgres
    url: postgres:5432
    database: zabbix
    user: zabbix
    secureJsonData:
      password: ${DB_PASS}
    jsonData:
      sslmode: disable
      postgresVersion: 1500

  - name: EJ-Elasticsearch
    type: elasticsearch
    url: http://opensearch:9200
    jsonData:
      index: atm-*
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: status
